<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>想起テスト 2026-10-09</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; max-width: 640px;
         margin: 0 auto; padding: 20px 16px 60px; color: #1a1a1a; background: #fafafa; }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  .date { color: #666; margin-bottom: 24px; }
  section.q { background: #fff; border: 1px solid #e2e2e2; border-radius: 10px;
               padding: 16px 18px; margin-bottom: 16px; }
  section.q h2 { font-size: 1.05rem; margin: 0 0 10px; }
  section.q .sub { color: #666; font-size: 0.85rem; margin: -6px 0 10px; }
  blockquote { margin: 8px 0; padding: 8px 12px; background: #f4f4f4;
                border-left: 3px solid #999; font-size: 0.95rem; white-space: pre-wrap; }
  label { display: block; font-size: 0.85rem; color: #444; margin: 10px 0 4px; }
  textarea { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc;
              border-radius: 6px; font-size: 0.95rem; font-family: inherit; resize: vertical; }
  button { display: block; width: 100%; background: #1a7f37; color: #fff; border: none;
            text-decoration: none; padding: 13px; border-radius: 8px; font-weight: 600;
            font-size: 1rem; margin-top: 14px; cursor: pointer; }
  button:disabled { background: #9bbfa6; cursor: default; }
  .result { margin-top: 12px; padding: 12px; border-radius: 8px; background: #eef8f0; }
  .result.fail { background: #fdecea; }
  .result .score { font-weight: 600; margin-bottom: 4px; }
  .model-answer { margin-top: 10px; padding: 12px; border-radius: 8px; background: #f1f4f9;
                   border-left: 3px solid #5b7db1; white-space: pre-wrap; }
  .model-answer .label { font-weight: 600; font-size: 0.85rem; color: #3d5a8a; margin-bottom: 4px; }
  .error { color: #b3261e; font-size: 0.9rem; margin-top: 8px; }
  .test-banner { background: #fff4e5; border: 1px solid #f0c27a; border-radius: 8px;
                  padding: 10px 12px; font-size: 0.85rem; color: #7a4b00; margin-bottom: 16px; }
  .done { text-align: center; color: #1a7f37; font-weight: 600; padding: 16px; }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>想起テスト</h1>
  <div class="date">2026-10-09</div>
  <p id="test-banner" class="test-banner hidden">テストモード：何度でも回答できます（回答と採点結果は毎回カードの回答履歴に記録されます）</p>
  <div id="questions"></div>
  <p id="done" class="done hidden">今日の分はすべて回答済みです。</p>

<script>
const GRADE_ENDPOINT = "https://mybrain-cards.vercel.app/api/grade";
const DATE = "2026-10-09";

// today.json の "test": true のときはテストモード：回答後も「もう一度回答する」で何度でも回答でき、
// 回答済みのキャッシュ（localStorage）も完了メッセージも使わない
let TEST_MODE = false;

function storageKey(card) { return 'recall:' + DATE + ':' + card; }

async function loadToday() {
  const res = await fetch('today.json?_=' + Date.now());
  return res.json();
}

function scoreLabel(score) {
  return `${score.total}/8点（正確さ${score.accuracy}・具体例${score.example}・適用条件${score.conditions}・次の行動${score.action}）`;
}

function renderResult(container, result) {
  container.innerHTML = '';
  if (!result.ok) {
    container.innerHTML = '<p class="error">エラー: ' + (result.error || 'unknown') + '</p>';
    return;
  }
  if (result.type === 'fill') {
    container.innerHTML = '<div class="result">記入ありがとうございます。明日から出題します。</div>';
    return;
  }
  const div = document.createElement('div');
  div.className = 'result ' + (result.passed ? 'pass' : 'fail');
  div.innerHTML = '<div class="score">' + (result.passed ? '合格' : '不合格') + ' ' + scoreLabel(result.score) + '</div>' +
                  '<div>' + escapeHtml(result.feedback || '') + '</div>';
  container.appendChild(div);
  if (result.model_answer) {
    const model = document.createElement('div');
    model.className = 'model-answer';
    model.innerHTML = '<div class="label">模範解答例</div><div>' + escapeHtml(result.model_answer) + '</div>';
    container.appendChild(model);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

async function submitAnswer(q, answers, btn, resultBox) {
  btn.disabled = true;
  btn.textContent = '送信中…';
  try {
    const resp = await fetch(GRADE_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date: DATE, card: q.card, qtype: q.qtype, question: q.text || '', answers: answers }),
    });
    const result = await resp.json();
    renderResult(resultBox, result);
    if (result.ok) {
      btn.closest('section').querySelectorAll('textarea').forEach(t => { t.readOnly = true; });
      if (TEST_MODE) {
        btn.disabled = false;
        btn.textContent = 'もう一度回答する';
        btn.dataset.again = '1';
        return;
      }
      try { localStorage.setItem(storageKey(q.card), JSON.stringify(result)); } catch (e) { /* ignore */ }
      btn.textContent = q.qtype === 'fill' ? '記入済み' : '回答済み';
      answeredCount += 1;
      updateDone();
    } else {
      btn.disabled = false;
      btn.textContent = '再送信';
    }
  } catch (e) {
    resultBox.innerHTML = '<p class="error">送信に失敗しました: ' + e.message + '</p>';
    btn.disabled = false;
    btn.textContent = '再送信';
  }
}

function renderQuestion(q, index) {
  const section = document.createElement('section');
  section.className = 'q';

  let inner = '<h2>Q' + (index + 1) + '. 「' + q.title + '」（' + q.book + '）</h2>';

  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(storageKey(q.card))); } catch (e) { /* ignore */ }
  if (cached && !TEST_MODE) {
    inner += '<div class="result-box"></div>';
    section.innerHTML = inner;
    renderResult(section.querySelector('.result-box'), cached);
    return section;
  }

  if (q.qtype === 'fill') {
    inner += '<p class="sub">まだ内容が確定していないカードです（採点はありません）</p>';
    inner += '<blockquote>' + (q.claim_draft || '') + '</blockquote>';
    inner += '<label>a) この考えを自分の言葉で1文</label><textarea data-field="claim" rows="2"></textarea>';
    inner += '<label>b) なぜ自分に重要か</label><textarea data-field="why" rows="2"></textarea>';
    inner += '<label>c) 使う場面の具体的な状況</label><textarea data-field="scene" rows="2"></textarea>';
    inner += '<button type="button">記入する</button>';
  } else {
    inner += '<p class="sub">' + QTYPE_LABELS[q.qtype] + 'の問い</p>';
    inner += '<blockquote>' + q.text + '</blockquote>';
    inner += '<textarea data-field="text" rows="4" placeholder="回答を入力"></textarea>';
    inner += '<button type="button">回答する</button>';
  }
  inner += '<div class="result-box"></div>';
  section.innerHTML = inner;

  const btn = section.querySelector('button');
  const resultBox = section.querySelector('.result-box');
  const submitLabel = btn.textContent;
  btn.addEventListener('click', () => {
    if (btn.dataset.again) {
      delete btn.dataset.again;
      btn.textContent = submitLabel;
      resultBox.innerHTML = '';
      section.querySelectorAll('textarea').forEach(t => { t.readOnly = false; t.value = ''; });
      section.querySelector('textarea').focus();
      return;
    }
    const answers = {};
    section.querySelectorAll('textarea').forEach(t => { answers[t.dataset.field] = t.value; });
    submitAnswer(q, answers, btn, resultBox);
  });

  return section;
}

const QTYPE_LABELS = { recall: '想起', apply: '適用', contrast: '対比・接続', refute: '反証' };

let totalCount = 0;
let answeredCount = 0;

function updateDone() {
  if (TEST_MODE) return;
  if (totalCount > 0 && answeredCount >= totalCount) {
    document.getElementById('done').classList.remove('hidden');
  }
}

(async function init() {
  const data = await loadToday();
  TEST_MODE = !!data.test;
  if (TEST_MODE) {
    document.getElementById('test-banner').classList.remove('hidden');
  }
  const container = document.getElementById('questions');
  data.questions.forEach((q, i) => container.appendChild(renderQuestion(q, i)));
  totalCount = data.questions.length;
  answeredCount = data.questions.filter(q => {
    try { return !!localStorage.getItem(storageKey(q.card)); } catch (e) { return false; }
  }).length;
  updateDone();
})();
</script>
</body>
</html>
