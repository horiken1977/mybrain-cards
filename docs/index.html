<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>想起テスト 2026-11-09</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; max-width: 640px;
         margin: 0 auto; padding: 20px 16px 60px; color: #1a1a1a; background: #fafafa; }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  .date { color: #666; margin-bottom: 24px; }
  section.q { background: #fff; border: 1px solid #e2e2e2; border-radius: 10px;
               padding: 16px 18px; margin-bottom: 16px; }
  section.q h2 { font-size: 1.05rem; margin: 0 0 10px; }
  section.q .sub { color: #666; font-size: 0.85rem; margin: -6px 0 10px; }
  blockquote { margin: 8px 0; padding: 8px 12px; background: #f4f4f4;
                border-left: 3px solid #999; font-size: 0.95rem; white-space: pre-wrap; }
  label { display: block; font-size: 0.85rem; color: #444; margin: 10px 0 4px; }
  textarea { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc;
              border-radius: 6px; font-size: 0.95rem; font-family: inherit; resize: vertical; }
  button { display: block; width: 100%; background: #1a7f37; color: #fff; border: none;
            text-decoration: none; padding: 13px; border-radius: 8px; font-weight: 600;
            font-size: 1rem; margin-top: 14px; cursor: pointer; }
  button:disabled { background: #9bbfa6; cursor: default; }
  .result { margin-top: 12px; padding: 12px; border-radius: 8px; background: #eef8f0; }
  .result.fail { background: #fdecea; }
  .result .score { font-weight: 600; margin-bottom: 4px; }
  .model-answer { margin-top: 10px; padding: 12px; border-radius: 8px; background: #f1f4f9;
                   border-left: 3px solid #5b7db1; white-space: pre-wrap; }
  .model-answer .label { font-weight: 600; font-size: 0.85rem; color: #3d5a8a; margin-bottom: 4px; }
  .error { color: #b3261e; font-size: 0.9rem; margin-top: 8px; }
  .test-banner { background: #fff4e5; border: 1px solid #f0c27a; border-radius: 8px;
                  padding: 10px 12px; font-size: 0.85rem; color: #7a4b00; margin-bottom: 16px; }
  .done { text-align: center; color: #1a7f37; font-weight: 600; padding: 16px; }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>想起テスト</h1>
  <div class="date">2026-11-09</div>
  <p id="test-banner" class="test-banner hidden">テストモード：何度でも回答できます（回答と採点結果は毎回カードの回答履歴に記録されます）</p>
  <div id="questions"></div>
  <p id="done" class="done hidden">今日の分はすべて回答済みです。</p>

<script>
const GRADE_ENDPOINT = "https://mybrain-cards.vercel.app/api/grade";
const DATE = "2026-11-09";
const CARDS_API = "https://api.github.com/repos/horiken1977/mybrain-cards/contents/";

// today.json の "test": true のときはテストモード：回答後も「もう一度回答する」で何度でも回答でき、
// 回答済みのキャッシュ（localStorage）も完了メッセージも使わない
let TEST_MODE = false;

function storageKey(card) { return 'recall:' + DATE + ':' + card; }

async function loadToday() {
  const res = await fetch('today.json?_=' + Date.now());
  return res.json();
}

// 4軸の短い名前は問いの型ごと（api/grade.py の SCORE_LABELS と同じ）
const SCORE_LABELS = {
  recall: ['正確さ', '具体例', '適用条件', '次の行動'],
  apply: ['場面', '使い方', '適用条件', '次の行動'],
  contrast: ['対立・補完', '具体例', '効く条件', '次の行動'],
  refute: ['成り立たない場面', '理由', '使える範囲', '次の行動'],
};

function scoreLabel(score, qtype) {
  const l = SCORE_LABELS[qtype] || SCORE_LABELS.recall;
  return `${score.total}/8点（${l[0]}${score.accuracy}・${l[1]}${score.example}・${l[2]}${score.conditions}・${l[3]}${score.action}）`;
}

function renderResult(container, result, qtype) {
  container.innerHTML = '';
  if (!result.ok) {
    container.innerHTML = '<p class="error">エラー: ' + (result.error || 'unknown') + '</p>';
    return;
  }
  if (result.type === 'fill') {
    container.innerHTML = '<div class="result">記入ありがとうございます。明日から出題します。</div>';
    return;
  }
  const div = document.createElement('div');
  div.className = 'result ' + (result.passed ? 'pass' : 'fail');
  div.innerHTML = '<div class="score">' + (result.passed ? '合格' : '不合格') + ' ' + scoreLabel(result.score, qtype) + '</div>' +
                  '<div>' + escapeHtml(result.feedback || '') + '</div>';
  container.appendChild(div);
  if (result.model_answer) {
    const model = document.createElement('div');
    model.className = 'model-answer';
    model.innerHTML = '<div class="label">模範解答例</div><div>' + escapeHtml(result.model_answer) + '</div>';
    container.appendChild(model);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

async function submitAnswer(q, answers, btn, resultBox) {
  btn.disabled = true;
  btn.textContent = '送信中…';
  try {
    const resp = await fetch(GRADE_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date: DATE, card: q.card, qtype: q.qtype, question: q.text || '', answers: answers }),
    });
    const result = await resp.json();
    renderResult(resultBox, result, q.qtype);
    if (result.ok) {
      btn.closest('section').querySelectorAll('textarea').forEach(t => { t.readOnly = true; });
      if (TEST_MODE) {
        btn.disabled = false;
        btn.textContent = 'もう一度回答する';
        btn.dataset.again = '1';
        return;
      }
      try { localStorage.setItem(storageKey(q.card), JSON.stringify(result)); } catch (e) { /* ignore */ }
      markAnswered(btn.closest('section'), q, result);
    } else {
      btn.disabled = false;
      btn.textContent = '再送信';
    }
  } catch (e) {
    resultBox.innerHTML = '<p class="error">送信に失敗しました: ' + e.message + '</p>';
    btn.disabled = false;
    btn.textContent = '再送信';
  }
}

function renderQuestion(q, index) {
  const section = document.createElement('section');
  section.className = 'q';

  let inner = '<h2>Q' + (index + 1) + '. 「' + q.title + '」（' + q.book + '）</h2>';

  if (q.qtype === 'fill') {
    inner += '<p class="sub">まだ内容が確定していないカードです（採点はありません）</p>';
    inner += '<blockquote>' + (q.claim_draft || '') + '</blockquote>';
    inner += '<label>a) この考えを自分の言葉で1文</label><textarea data-field="claim" rows="2"></textarea>';
    inner += '<label>b) なぜ自分に重要か</label><textarea data-field="why" rows="2"></textarea>';
    inner += '<label>c) 使う場面の具体的な状況</label><textarea data-field="scene" rows="2"></textarea>';
    inner += '<button type="button">記入する</button>';
  } else {
    inner += '<p class="sub">' + QTYPE_LABELS[q.qtype] + 'の問い</p>';
    inner += '<blockquote>' + q.text + '</blockquote>';
    inner += '<textarea data-field="text" rows="4" placeholder="回答を入力"></textarea>';
    inner += '<button type="button">回答する</button>';
  }
  inner += '<div class="result-box"></div>';
  section.innerHTML = inner;

  const btn = section.querySelector('button');
  const resultBox = section.querySelector('.result-box');
  const submitLabel = btn.textContent;
  btn.addEventListener('click', () => {
    if (btn.dataset.again) {
      delete btn.dataset.again;
      btn.textContent = submitLabel;
      resultBox.innerHTML = '';
      section.querySelectorAll('textarea').forEach(t => { t.readOnly = false; t.value = ''; });
      section.querySelector('textarea').focus();
      return;
    }
    const answers = {};
    section.querySelectorAll('textarea').forEach(t => { answers[t.dataset.field] = t.value; });
    submitAnswer(q, answers, btn, resultBox);
  });

  return section;
}

const QTYPE_LABELS = { recall: '想起', apply: '適用', contrast: '対比・接続', refute: '反証' };

let totalCount = 0;
const answered = {};  // card -> true（その日に回答済み）

function updateDone() {
  if (TEST_MODE) return;
  const n = Object.keys(answered).length;
  if (totalCount > 0 && n >= totalCount) {
    document.getElementById('done').classList.remove('hidden');
  }
}

// 回答済みの問いは結果だけを出す（二重回答を API は拒まないが、ページは送らせない）
function markAnswered(section, q, result) {
  if (!section || !result || !result.ok) return;
  const h2 = section.querySelector('h2').outerHTML;
  const state = q.qtype === 'fill' ? '記入済み' : '回答済み';
  section.innerHTML = h2 + '<p class="sub">' + state + '</p><div class="result-box"></div>';
  renderResult(section.querySelector('.result-box'), result, q.qtype);
  answered[q.card] = true;
  updateDone();
}

// ---- ハブのカードの回答履歴から、その日の最新の行を読む（api/grade.py の HIST_RE・append_history と同じ形）
const HIST_RE = /^- (\d{4}-\d{2}-\d{2}) \| ([^|\n]+?) \| ([^|\n]*?) \| ([^|\n]*?) \|(.*)$/;

function todayEntry(text, qtype) {
  const idx = text.lastIndexOf('## 回答履歴\n');
  if (idx === -1) return null;
  const lines = text.slice(idx).split('\n');
  for (let i = 0; i < lines.length; i++) {
    const m = HIST_RE.exec(lines[i]);
    if (!m || m[1] !== DATE) continue;
    const isFill = m[2].trim() === '補完';
    if (isFill !== (qtype === 'fill')) continue;
    const details = {};
    for (let j = i + 1; j < lines.length && lines[j].startsWith('  - '); j++) {
      const d = lines[j].slice(4);
      const k = d.indexOf(': ');
      if (k > 0) details[d.slice(0, k)] = d.slice(k + 2);
    }
    return { label: m[2].trim(), score: m[3].trim(), verdict: m[4].trim(), note: m[5].trim(), details };
  }
  return null;  // 新しい行ほど上。その日の行がなければ未回答
}

function entryToResult(e, qtype) {
  if (qtype === 'fill') return { ok: true, type: 'fill' };
  const nums = (e.details['内訳'] || '').split('・').map(x => { const m = /(\d+)\s*$/.exec(x); return m ? +m[1] : '-'; });
  const total = parseInt(e.score, 10);
  return {
    ok: true, type: 'graded',
    passed: e.verdict.startsWith('合格'),
    score: { total: isNaN(total) ? e.score : total, accuracy: nums[0] ?? '-', example: nums[1] ?? '-',
              conditions: nums[2] ?? '-', action: nums[3] ?? '-' },
    feedback: e.note,
    model_answer: e.details['模範解答例'] || '',
  };
}

async function fetchCardText(card) {
  const res = await fetch(CARDS_API + encodeURIComponent(card) + '?ref=main', {
    headers: { 'Accept': 'application/vnd.github.raw' }, cache: 'no-store',
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);  // 上限（403/429）・通信の失敗は写しのまま
  return res.text();
}

async function syncFromHub(q, section) {
  if (answered[q.card]) return;  // 写しで回答済みなら読み直さない
  try {
    const e = todayEntry(await fetchCardText(q.card), q.qtype);
    if (!e) return;
    const result = entryToResult(e, q.qtype);
    try { localStorage.setItem(storageKey(q.card), JSON.stringify(result)); } catch (err) { /* ignore */ }
    // 読んでいる間に、このページで送って回答済みにしていれば上書きしない
    if (!answered[q.card]) markAnswered(section, q, result);
  } catch (err) { /* 読めないときは localStorage の写しか未回答のまま */ }
}

(async function init() {
  const data = await loadToday();
  TEST_MODE = !!data.test;
  if (TEST_MODE) {
    document.getElementById('test-banner').classList.remove('hidden');
  }
  const container = document.getElementById('questions');
  totalCount = data.questions.length;
  const sections = data.questions.map((q, i) => {
    const section = renderQuestion(q, i);
    container.appendChild(section);
    return section;
  });
  if (TEST_MODE) return;
  // まず localStorage の写しを出す（最初の表示を速くするためだけ）
  data.questions.forEach((q, i) => {
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem(storageKey(q.card))); } catch (e) { /* ignore */ }
    if (cached) markAnswered(sections[i], q, cached);
  });
  // 続けてハブのカードの回答履歴で決め直す
  await Promise.all(data.questions.map((q, i) => syncFromHub(q, sections[i])));
})();
</script>
</body>
</html>
