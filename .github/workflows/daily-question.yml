name: Daily recall question

on:
  schedule:
    - cron: "0 17 * * *"  # 17:00 UTC = 02:00 JST (next day)。定時は毎日3時間ほど遅れて動く（07:17 の設定で 09:40〜11:19 に動いていた）ため、朝7時ごろに届くよう早めた（2026-10-12 本人の指定。それまでは 07:17 JST、2026-10-02 までは 08:00 JST）
  workflow_dispatch:
    inputs:
      limit:
        description: "出題数（空欄ならリポジトリ変数 RECALL_LIMIT、未設定なら1）"
        required: false
        default: ""

permissions:
  issues: write
  contents: write
  pages: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select due cards, build the interactive Pages site, and fire a notification Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: scripts
          # 1日の出題数（現在 RECALL_LIMIT=3）。変更は `gh variable set RECALL_LIMIT --body N`（コード変更不要）
          RECALL_LIMIT: ${{ github.event.inputs.limit || vars.RECALL_LIMIT || '1' }}
          # 補完（未記入カードの記入）の1日あたり上限。採点ありの問いが足りない日は上限を超えて補完で埋める
          RECALL_FILL_LIMIT: ${{ vars.RECALL_FILL_LIMIT || '1' }}
          # 直近の本を先に出す窓（日数。365 か 183。未設定なら空で今の並び）。変更は `gh variable set RECALL_RECENT_WINDOW --body 365`、戻すのは変数を消す
          RECALL_RECENT_WINDOW: ${{ vars.RECALL_RECENT_WINDOW || '' }}
        run: python scripts/select_and_post.py
      - name: Publish docs/ to GitHub Pages
        run: |
          if [ -n "$(git status --porcelain docs/)" ]; then
            git config user.name "recall-bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/
            git commit -m "pages: recall page for $(date -u +%F)"
            git push
          fi
