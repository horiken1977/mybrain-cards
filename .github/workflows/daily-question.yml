name: Daily recall question

on:
  schedule:
    - cron: "0 23 * * *"  # 23:00 UTC = 08:00 JST (next day)
  workflow_dispatch:
    inputs:
      limit:
        description: "出題数（小さく始める場合は1）"
        required: false
        default: "3"

permissions:
  issues: write
  contents: write
  pages: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select due cards, build the interactive Pages site, and fire a notification Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: scripts
          RECALL_LIMIT: ${{ github.event.inputs.limit || '3' }}
          PAGES_TRIGGER_TOKEN: ${{ secrets.PAGES_TRIGGER_TOKEN }}
        run: python scripts/select_and_post.py
      - name: Publish docs/ to GitHub Pages
        run: |
          if [ -n "$(git status --porcelain docs/)" ]; then
            git config user.name "recall-bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/
            git commit -m "pages: recall page for $(date -u +%F)"
            git push
          fi
