name: Debug secret length

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Report length only (value is never printed)
        env:
          TOKEN: ${{ secrets.PAGES_TRIGGER_TOKEN }}
        run: |
          echo "length=${#TOKEN}"
          echo "first4=${TOKEN:0:4}"
          echo "last4=${TOKEN: -4}"
